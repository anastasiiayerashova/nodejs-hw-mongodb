tags:
  - Auth
summary: Send reset password email
operationId: sendResetPasswordEmail
description: 'Send reset password email with payload'
security:
  - bearerAuth: []
requestBody:
  description: User's email is required
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: "User's email. Should be between 3 and 25"
            type: string
            format: email
            minLength: 3
            maxLength: 25
            example: 'ivan5@example.com'
responses:
  '200':
    description: Reset password email was successfully sent
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent
            data:
              type: object
              example: {}
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
