type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - email
  - isFavourite
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380000000005'
  contactType:
    description: "Contact's contact type"
    type: string
    enum: ['work', 'home', 'personal']
  email:
    description: "Contact's email. Should be between 3 and 20"
    type: string
    example: 'ivan5@example.com'
  isFavourite:
    description: "Whether is contact's favourite"
    type: boolean
    example: false
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    description: 'The date and time when the contact was created'
    type: string
    format: date-time
    example: 2025-02-11T09:10:58.162+00:00
  updatedAt:
    description: 'The date and time when the contact was last updated'
    type: string
    format: date-time
    example: 2025-02-11T09:11:07.014+00:00
