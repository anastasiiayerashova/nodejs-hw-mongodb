tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Patch a contact with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name. Name should only contain letters and spaces"
            type: string
            pattern: "^[A-Za-zÀ-ÿ\\s]+$"
            minLength: 3
            maxLength: 20
          phoneNumber:
            description: "Contact's phone number"
            type: string
            minLength: 6
          contactType:
            description: "Contact's contact type"
            type: string
            enum: ['work', 'home', 'personal']
            default: personal
          email:
            description: "Contact's email. Should be between 3 and 20"
            type: string
            format: email
            minLength: 3
            maxLength: 20
          isFavourite:
            description: "Whether is contact's favourite"
            type: boolean
            default: false
          userId:
            description: "Contact's user id"
            type: string
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Successfully upserted a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
