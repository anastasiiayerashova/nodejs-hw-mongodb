type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "User's name. Should be between 3 and 20"
    type: string
    example: 'John Doe'
  email:
    description: "User's email. Should be between 3 and 25"
    type: string
    example: 'ivan5@example.com'
  password:
    description: "User's password. Should be between 3 and 20"
    type: string
    example: 111
  createdAt:
    description: 'The date and time when the user was created'
    type: string
    format: date-time
    example: 2025-02-11T09:10:58.162+00:00
  updatedAt:
    description: 'The date and time when the user was last updated'
    type: string
    format: date-time
    example: 2025-02-11T09:11:07.014+00:00
