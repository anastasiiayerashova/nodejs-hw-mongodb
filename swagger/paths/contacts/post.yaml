tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name. Name should only contain letters and spaces"
            type: string
            pattern: "^[A-Za-zÀ-ÿ\\s]+$"
            minLength: 3
            maxLength: 20
          phoneNumber:
            description: "Contact's phone number"
            type: string
            minLength: 6
          contactType:
            description: "Contact's contact type"
            type: string
            enum: ['work', 'home', 'personal']
            default: personal
          email:
            description: "Contact's email. Should be between 3 and 20"
            type: string
            format: email
            minLength: 3
            maxLength: 20
          isFavourite:
            description: "Whether is contact's favourite"
            type: boolean
            default: false
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
